name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # materialize the android/ platform folder from the unified codebase
      - name: Flutter create (idempotent)
        run: flutter create . --platforms android --org app.orubus --project-name relay_client

      - name: Patch applicationId + signing
        run: bash scripts/patch_android.sh

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/relay-release.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret missing — building unsigned release"
          fi

      - name: Pub get
        run: flutter pub get

      # AGP 8.10+ rejects proguard-android.txt inside flutter_inappwebview_android 1.1.3
      - name: Patch plugin proguard flag (AGP compat)
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          [ -f "$FILE" ] && sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/" "$FILE" || true

      - name: Build APK (signed)
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_PATH: /tmp/relay-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build APK (unsigned fallback)
        if: steps.keystore.outputs.present != 'true'
        run: flutter build apk --release

      - name: Build app bundle (signed only)
        if: steps.keystore.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: /tmp/relay-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/relay-${GITHUB_REF_NAME#v}-android.apk 2>/dev/null || \
            cp build/app/outputs/flutter-apk/app-release.apk out/relay-android.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab out/relay-${GITHUB_REF_NAME#v}-android.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: relay-android
          path: out/

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
