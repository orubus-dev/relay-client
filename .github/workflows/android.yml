name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # materialize the android/ platform folder from the unified codebase
      - name: Flutter create (idempotent)
        run: flutter create . --platforms android --org app.orubus --project-name relay_client

      - name: Patch applicationId + signing + R8
        run: bash scripts/patch_android.sh

      # the platform folder is regenerated every build — the launcher icon must be too
      - name: Generate launcher icons (adaptive + monochrome + windows)
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/relay-release.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret missing — building unsigned release"
          fi

      - name: Pub get
        run: flutter pub get

      # AGP 8.10+ rejects proguard-android.txt inside flutter_inappwebview_android 1.1.3
      - name: Patch plugin proguard flag (AGP compat)
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          [ -f "$FILE" ] && sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/" "$FILE" || true

      # split-per-abi: one ABI per APK — ~20-25MB instead of a 60MB fat APK.
      # --obfuscate + --split-debug-info strip Dart symbols out of the binary.
      # A universal fat APK is built too — the Downloads tab offers it for
      # users who don't know their CPU architecture.
      - name: Build APKs (signed, split per ABI + universal)
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_PATH: /tmp/relay-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build APKs (unsigned fallback, split per ABI + universal)
        if: steps.keystore.outputs.present != 'true'
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build app bundle (signed only)
        if: steps.keystore.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: /tmp/relay-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p out
          VER="${GITHUB_REF_NAME#v}"
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/relay-${VER}-android.apk"
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/relay-${VER}-android-armv7.apk"
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "out/relay-${VER}-android-x86_64.apk"
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-release.apk "out/relay-${VER}-android-universal.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "out/relay-${VER}-android.aab"
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: relay-android
          path: out/

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
