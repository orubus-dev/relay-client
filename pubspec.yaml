name: relay_client
description: Relay — Signal-grade E2EE messenger. Unified Flutter client for Android + Windows.
publish_to: "none"
version: 1.0.7+1070

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # state
  flutter_riverpod: ^2.5.1
  # backend
  supabase: ^2.5.0
  realtime_client: ^2.2.0
  gotrue: ^2.8.0
  # local database (messages live here — network only fetches NEW messages)
  sqlite3: ^2.4.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # crypto — mirrors the web client's X3DH + Double Ratchet wire format
  cryptography: ^2.7.0
  convert: ^3.1.1
  # auth via WebView (Continue with Google just works — no native OAuth setup)
  flutter_inappwebview: ^6.1.5
  # storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  # media
  record: ^7.1.2
  just_audio: ^0.9.39
  just_audio_windows: ^0.2.2  # voice/story playback on Windows (else MissingPluginException)
  image_picker: ^1.1.2
  http: ^1.2.1
  # runtime permissions (OS ground truth for the mic)
  permission_handler: ^11.3.1
  # ui
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  share_plus: ^12.0.2
  # desktop window (Windows client)
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  monochrome_icon: "assets/icon/app_icon_monochrome.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
